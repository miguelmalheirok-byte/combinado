<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Página não encontrada · Combinado</title>
<script>
/* Aplica o tema salvo (ou o do aparelho) antes de desenhar a página, para não piscar. */
(function () {
  var tema = "claro";
  try {
    var salvo = localStorage.getItem("combinado:tema:v1");
    if (salvo === "claro" || salvo === "escuro") {
      tema = salvo;
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      tema = "escuro";
    }
  } catch (e) {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "escuro";
  }
  document.documentElement.setAttribute("data-tema", tema);
})();
</script>
<link rel="stylesheet" href="/combinado/css/style.css" />
<link rel="icon" type="image/png" href="/combinado/img/logo.png" />
</head>
<body>

<section class="tela-auth">
  <div class="auth-coluna">
    <div class="auth-marca-linha">
      <img src="/combinado/img/logo.png" alt="" class="auth-logo" width="52" height="52" />
      <span class="auth-wordmark">Combinado</span>
    </div>

    <div class="auth-cartao" style="text-align:center;">
      <h1 style="font-size:64px; margin:0 0 8px;">404</h1>
      <p style="margin:0 0 22px;">
        Essa página não existe. Deve ter se perdido no caminho, assim como aquele trabalho sem dono no grupo.
      </p>
      <a href="/combinado/" class="botao botao-primario auth-botao-principal" style="display:block; text-decoration:none; text-align:center; line-height:24px;">
        Voltar para o Combinado
      </a>
    </div>
  </div>
</section>

</body>
</html>
