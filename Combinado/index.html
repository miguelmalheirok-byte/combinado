<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Combinado</title>
<meta name="description" content="Combinado: organize os trabalhos da faculdade — individuais e em grupo, de todas as matérias, num lugar só." />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:," />
</head>
<body>

<header class="cabecalho">
  <span class="cabecalho-marca">Combinado</span>
</header>

<main class="conteudo">

  <div class="conteudo-cabecalho">
    <h1>Trabalhos</h1>
    <button type="button" id="btn-novo-trabalho" class="botao botao-primario">+ Novo trabalho</button>
  </div>

  <p id="lista-vazia" class="estado-vazio" hidden>
    Nenhum trabalho cadastrado ainda. Toque em "Novo trabalho" para começar.
  </p>

  <ul id="lista-trabalhos" class="lista-trabalhos"></ul>

</main>

<!-- ===================== DIÁLOGO: NOVO TRABALHO ===================== -->
<dialog id="dialog-trabalho">
  <form id="form-trabalho" method="dialog">
    <h2>Novo trabalho</h2>

    <div class="campo">
      <label for="input-titulo-trabalho">Título</label>
      <input type="text" id="input-titulo-trabalho" placeholder="Ex.: Projeto A3" required />
    </div>

    <div class="campo">
      <label for="input-materia-trabalho">Matéria</label>
      <input type="text" id="input-materia-trabalho" placeholder="Ex.: Sistemas Distribuídos" required />
    </div>

    <div class="campo">
      <label for="input-prazo-trabalho">Prazo</label>
      <input type="date" id="input-prazo-trabalho" />
    </div>

    <fieldset class="campo campo-radio">
      <legend>Tipo</legend>
      <label class="opcao-radio">
        <input type="radio" name="tipo-trabalho" value="individual" checked />
        Individual
      </label>
      <label class="opcao-radio">
        <input type="radio" name="tipo-trabalho" value="grupo" />
        Em grupo
      </label>
    </fieldset>

    <div class="dialog-acoes">
      <button type="button" class="botao botao-texto" data-fechar-dialog>Cancelar</button>
      <button type="submit" class="botao botao-primario">Salvar</button>
    </div>
  </form>
</dialog>

<!-- ===================== DIÁLOGO: CONFIRMAÇÃO DE EXCLUSÃO ===================== -->
<dialog id="dialog-confirmar">
  <div class="dialog-confirmar-corpo">
    <h2 id="dialog-confirmar-titulo">Excluir trabalho?</h2>
    <p id="dialog-confirmar-texto"></p>
    <div class="dialog-acoes">
      <button type="button" class="botao botao-texto" data-fechar-confirmar>Cancelar</button>
      <button type="button" id="btn-confirmar-exclusao" class="botao botao-perigo">Excluir</button>
    </div>
  </div>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
